<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CH03 통폐합 후 통학거리가 늘어나는 학생 — 와플차트</title>
<style>
  /* ===== CH03 등굣길 섹션 규격 (design.css 기준) ===== */
  :root{
    --section-bg:#F3F0E6;   /* 등굣길 섹션 배경 */
    --ink:#282828;
    --ink-soft:#6B675C;
    --c-dec:#CCE668;        /* 인구감소지역 (강조) */
    --c-dec-text:#6E8A1E;   /* 인구감소지역 숫자 글자색 (연두를 글자로 읽히게 진하게) */
    --c-non:#BABBBC;        /* 그 외 지역 */
    --c-non-text:#8E8F91;
    --empty:#D6D0BE;        /* 빈 칸 테두리 */
    --rule:#D9D2BF;
    --font:'KoPubDotum Light','KoPubWorld Dotum','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    --font-b:'KoPubDotum Bold','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--section-bg);color:var(--ink);font-family:var(--font);letter-spacing:-0.01em}
  body{padding:40px 16px}

  .wf{max-width:820px;margin:0 auto;position:relative}
  .wf-title{font-family:var(--font-b);font-size:19px;font-weight:700;margin:0 0 26px;letter-spacing:-0.03em;text-align:center}
  .wf-hint{font-size:13px;color:var(--ink-soft);margin:0 0 14px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
  .wf-hint i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .wf-hint i.full{background:linear-gradient(135deg,var(--c-dec) 50%,var(--c-non) 50%)}
  .wf-hint i.empty{border:1.5px solid var(--empty)}

  /* ----- 1부: 와플 (비율) ----- */
  .wf-pair{display:grid;grid-template-columns:1fr 1fr;gap:32px}
  .wf-one{min-width:0}
  .wf-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px;flex-wrap:wrap;max-width:320px}
  .wf-name{font-family:var(--font-b);font-weight:700;font-size:16px}
  .wf-one.non .wf-name{color:var(--c-non-text)}
  .wf-pct{font-family:var(--font-b);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-0.04em}
  .wf-one.dec .wf-pct{color:var(--c-dec-text)} .wf-one.non .wf-pct{color:var(--c-non-text)}
  .wf-pct small{font-size:15px;margin-left:1px}
  .wf-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:100%;max-width:320px}
  .wf-cell{aspect-ratio:1;border-radius:2px;border:1.5px solid var(--empty);opacity:0;transform:scale(.4);
           transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
  .wf.in .wf-cell{opacity:1;transform:none}
  .wf-one.dec .wf-cell.inc{background:var(--c-dec);border-color:var(--c-dec)}
  .wf-one.non .wf-cell.inc{background:var(--c-non);border-color:var(--c-non)}
  .wf-one.dim-inc .wf-cell.inc,.wf-one.dim-rest .wf-cell:not(.inc){opacity:.3}
  .wf-sub{margin:8px 0 0;font-size:13px;color:var(--ink-soft);line-height:1.55}


  .wf-tip{position:absolute;pointer-events:none;background:#FFFFFF;color:var(--ink);font-size:13px;line-height:1.55;
          padding:9px 11px;border-radius:3px;border:1px solid var(--rule);box-shadow:0 4px 14px rgba(40,40,40,.14);
          opacity:0;transition:opacity .12s;z-index:3;max-width:270px}
  .wf-tip b{display:block;font-size:13.5px}

  .wf-foot{margin-top:24px;padding-top:12px;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-soft);line-height:1.6}

  @media (max-width:560px){
    .wf-title{font-size:17px}
    .wf-pair{gap:14px}
    .wf-grid{gap:2px}
    .wf-pct{font-size:26px}
    .wf-name{font-size:14px}
  }
  @media (prefers-reduced-motion:reduce){ .wf-cell{transition:none} }
</style>
</head>
<body>

<section class="wf" id="wf" aria-labelledby="wf-title">
  <h3 class="wf-title" id="wf-title">통폐합 후 통학거리가 늘어나는 학생은</h3>

  <p class="wf-hint"><span><i class="full"></i>채운 칸 통학거리 증가</span><span><i class="empty"></i>빈 칸 감소 또는 변화 없음</span><span>한 칸 = 각 지역 학생의 1%</span></p>
  <div class="wf-pair" id="wf-pair"></div>

  <div class="wf-tip" id="wf-tip"></div>
  <div class="wf-foot">통폐합 대상 720개 묶음의 분석 가능 학생(가중치 추정) 기준 · 도로 통학거리 · 자료: DIVA팀 통폐합 시뮬레이션</div>
</section>

<script>
(function(){
  // ===== 데이터 (통학부담 분석 결과, 학생 가중치) =====
  // inc: 거리가 늘어난 학생, rest: 감소 또는 변화 없음
  const REGIONS = [
    {id:'dec', name:'인구감소지역', inc:12427.2033, rest:21208.2862},
    {id:'non', name:'그 외 지역',   inc:67124.7179, rest:62571.9706}
  ];
  const fmtN = n => '약 ' + (Math.round(n / 100) * 100).toLocaleString('ko-KR') + '명';

  const root = document.getElementById('wf');
  const pair = document.getElementById('wf-pair');
  const tip = document.getElementById('wf-tip');

  function place(x, y){
    const rr = root.getBoundingClientRect();
    tip.style.opacity = 1;
    x = Math.max(4, Math.min(x, rr.width - tip.offsetWidth - 4));
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  const hideTip = () => { tip.style.opacity = 0; };

  REGIONS.forEach(r => {
    const total = r.inc + r.rest, pct = r.inc / total * 100;

    // --- 와플 ---
    const one = document.createElement('div');
    one.className = 'wf-one ' + r.id;
    one.innerHTML =
      `<div class="wf-head"><span class="wf-name">${r.name}</span><span class="wf-pct">${pct.toFixed(1)}<small>%</small></span></div>` +
      `<div class="wf-grid" role="img" aria-label="${r.name} 학생 중 ${pct.toFixed(1)}%의 통학거리가 늘어남 (${fmtN(r.inc)} / ${fmtN(total)})"></div>` +
      `<p class="wf-sub">${fmtN(total)} 중 ${fmtN(r.inc)}</p>`;
    const grid = one.querySelector('.wf-grid'), cells = Math.round(pct);
    for (let i = 0; i < 100; i++){
      const c = document.createElement('div');
      c.className = 'wf-cell' + (i < cells ? ' inc' : '');
      c.style.transitionDelay = i * 8 + 'ms';
      c.dataset.kind = i < cells ? 'inc' : 'rest';
      grid.appendChild(c);
    }
    grid.addEventListener('pointermove', e => {
      const c = e.target.closest('.wf-cell'); if (!c) return;
      const isInc = c.dataset.kind === 'inc';
      one.classList.toggle('dim-rest', isInc); one.classList.toggle('dim-inc', !isInc);
      tip.innerHTML = `<b>${r.name} · ${isInc ? '통학거리 증가' : '감소 또는 변화 없음'}</b>${(isInc ? pct : 100 - pct).toFixed(1)}% (${fmtN(isInc ? r.inc : r.rest)})`;
      const rr = root.getBoundingClientRect();
      place(e.clientX - rr.left + 12, e.clientY - rr.top + 12);
    });
    grid.addEventListener('pointerleave', () => { one.classList.remove('dim-inc', 'dim-rest'); hideTip(); });
    pair.appendChild(one);

  });
  document.addEventListener('click', hideTip);

  // ===== 화면에 들어오면 칸이 차례로 채워짐 =====
  // 기사 iframe 안이면 기사 창 기준으로, 단독으로 열면 이 창 기준으로 판단
  let entered = false;
  const enter = () => {
    if (entered) return; entered = true;
    root.classList.add('in');
  };
  // 기사 페이지(바로 바깥 창). 바깥에 다른 사이트의 창이 더 있어도(예: 미리보기 화면) 기사 페이지 기준으로 동작
  const host = (() => { try { const p = window.parent; if (p && p !== window && window.frameElement) { p.addEventListener; void p.innerHeight; return p; } } catch (e) {} return null; })();
  if (host){
    const check = () => {
      if (entered) return;
      const fr = window.frameElement.getBoundingClientRect(), rr = root.getBoundingClientRect();
      const top = fr.top + rr.top, vh = host.innerHeight;
      if (top < vh * .75 && top + rr.height > vh * .1){ enter(); host.removeEventListener('scroll', check); }
    };
    host.addEventListener('scroll', check, {passive: true});
    check();
  } else if ('IntersectionObserver' in window){
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)){ enter(); io.disconnect(); } }, {threshold: .2});
    io.observe(root);
  } else enter();
})();
</script>
</body>
</html>
